<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#131723" />
  <meta name="application-name" content="BitBlock DeFi Tracker" />
  <meta name="apple-mobile-web-app-title" content="BitBlock DeFi Tracker" />
  <title>BitBlock DeFi Tracker</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/dashboard" aria-label="BitBlock DeFi Tracker home">
      <span class="logo"><img src="/logo.svg" alt="" width="44" height="44" /></span>
      <span class="brand-text">
        <span class="brand-name">BitBlock</span>
        <span class="brand-sub"><b>DeFi Tracker</b></span>
      </span>
    </a>
    <div class="portfolio-switch">
      <label for="portfolioSel">Portfolio</label>
      <div class="ps-row">
        <select id="portfolioSel" aria-label="Switch portfolio"></select>
        <button class="icon-btn" id="portfolioManage" title="New, rename or delete portfolios" aria-label="Manage portfolios">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <nav class="nav" aria-label="Sections">
      <div class="nav-section">Overview</div>
      <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5.5h4V20"/></svg>Dashboard</a>
      <a href="#/positions" data-route="positions"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="m7 13 3-3 2.5 2L17 8"/><path d="M8 21h8M12 17v4"/></svg>Positions</a>

      <div class="nav-section">Portfolio</div>
      <a href="#/wallets" data-route="wallets"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v4"/><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M16 13h.01"/></svg>Wallets</a>
      <a href="#/prices" data-route="prices"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2c-.5-.9-1.6-1.4-2.8-1.4-1.6 0-2.8.8-2.8 2.1 0 3 5.6 1.6 5.6 4.3 0 1.3-1.2 2.1-2.8 2.1-1.3 0-2.4-.6-2.9-1.5M12 6v1.8M12 16.2V18"/></svg>Prices</a>

      <div class="nav-section">Help</div>
      <a href="#/guide" data-route="guide"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 5.8 14.5 4 17.5 4 20 5.5V19c-2.5-1.5-5.5-1.5-8 .3-2.5-1.8-5.5-1.8-8-.3z"/><path d="M12 5.8v13.5"/></svg>Guide</a>
    </nav>

    <div class="sidebar-foot">
      <button class="btn primary block" id="syncAllBtn" title="Refresh every wallet from every connected source, plus prices">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/></svg><span>Sync all</span></button>
      <div class="sync-note" id="syncNote"></div>
      <button class="btn ghost block" id="newPositionBtn">+ New position</button>
      <button class="btn ghost block" id="themeToggle" aria-label="Toggle light / dark">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span>Light mode</span>
      </button>
    </div>
  </aside>

  <main id="view" class="container"></main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></div>
  </aside>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/chart.js/chart.umd.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
