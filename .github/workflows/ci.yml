name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block secrets and wallet addresses
        run: sh scripts/check-secrets.sh --all
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
